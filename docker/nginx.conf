user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr;
  sendfile on;
  client_max_body_size 2g;
  server_tokens off;
  gzip on; gzip_comp_level 5; gzip_proxied any; gzip_vary on; gzip_min_length 512;
  gzip_types text/css application/javascript image/svg+xml application/json;

  # Easypanel (Traefik) termina el HTTPS y nos dice el protocolo original
  map $http_x_forwarded_proto $proto_real { default $http_x_forwarded_proto; "" $scheme; }

  # IP real del visitante (Traefik va delante)
  real_ip_header X-Forwarded-For;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;

  limit_req_zone $binary_remote_addr zone=asvs_login:10m rate=12r/m;

  server {
    listen 80;


    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $proto_real;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_redirect off;

    location = /api/login {
      limit_req zone=asvs_login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://127.0.0.1:3000;
    }
    location = /login      { proxy_pass http://127.0.0.1:3000; }
    location = /api/csrf   { proxy_pass http://127.0.0.1:3000; }
    location = /api/logout { proxy_pass http://127.0.0.1:3000; }
    location = /api/me     { proxy_pass http://127.0.0.1:3000; }
    location = /api/health { proxy_pass http://127.0.0.1:3000; }
    location /css/    { proxy_pass http://127.0.0.1:3000; }
    location /js/     { proxy_pass http://127.0.0.1:3000; }
    location /assets/ { proxy_pass http://127.0.0.1:3000; }

    location = /_auth {
      internal;
      proxy_pass http://127.0.0.1:3000/api/_auth;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
    }

    location / {
      auth_request /_auth;
      error_page 401 403 = @al_login;
      proxy_pass http://127.0.0.1:8110;
      proxy_connect_timeout 10s;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
    location @al_login { return 302 /login; }
  }
}
